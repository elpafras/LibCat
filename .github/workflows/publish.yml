name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish LibCat (:setting) to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          # Rahasia GPG dipetakan ke variabel sementara untuk di-decode
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # 1. Decode Base64 key jika tersimpan sebagai base64
          if [[ "${GPG_KEY}" != *"BEGIN PGP"* ]]; then
            GPG_KEY=$(echo $GPG_KEY | base64 --decode)
          fi
          
          # 2. Map ke environment variable yang dipahami Gradle sebagai property 'signing.key' dan 'signing.password'
          # Penggunaan double underscore (__) memetakan ke titik (.) pada property name
          export ORG_GRADLE_PROJECT_signing__key="$GPG_KEY"
          export ORG_GRADLE_PROJECT_signing__password="$GPG_PASSWORD"

          ./gradlew :setting:publishAllPublicationsToMavenCentralRepository --no-configuration-cache \
            -Pversion=${{ steps.version.outputs.version }}